<!DOCTYPE html>
<html lang="en">
<head>
    <title>Basic</title>
   
</head>
<body>
  
    <h2>hello js</h2>

    <script>
        let bob = {
            name: "Bob",
            hello: function() {
                return `Hello ${this.name}`;
            }
        };

        class Animal {
            constructor(name) {
                this.name = name;
            }

            hello() {
                return `Hello ${this.name}`;
            }
        }

        class Dog extends Animal {
            run() {
                return `${this.name} is running...`;
            }
        }

        let dog = new Dog("Lucy");
    </script>
</body>
</html>
