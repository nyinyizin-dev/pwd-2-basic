<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row gap-0" >
            <div class="col-3 col-md-2 bg-light">
                <h1 class="h3 text-primary text-center py-3">
                    <i class="fa-solid fa-ghost"></i>
                    <span class="ms-2 d-none d-md-inline">App</span>
                </h1>
                <ul class="list-group mb-4 text-center text-md-start">
                    <li class="list-group-item active">
                        <i class="fa-solid fa-home"></i>
                        <span class="ms-2 d-none d-md-inline">Home</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-users"></i>
                        <span class="ms-2 d-none d-md-inline">Users</span>
                    </li>
                    <li class="list-group-item ">
                        <i class="fa-solid fa-flag"></i>
                        <span class="ms-2 d-none d-md-inline">Issues</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-gear"></i>
                        <span class="ms-2 d-none d-md-inline">Settings</span>
                    </li>
                </ul>
                <ul class="list-group mb-4 text-center text-md-start">
                    <li class="list-group-item ">
                        <i class="fa-solid fa-home"></i>
                        <span class="ms-2 d-none d-md-inline">Home</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-users"></i>
                        <span class="ms-2 d-none d-md-inline">Users</span>
                    </li>
                    <li class="list-group-item ">
                        <i class="fa-solid fa-flag"></i>
                        <span class="ms-2 d-none d-md-inline">Issues</span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-gear"></i>
                        <span class="ms-2 d-none d-md-inline">Settings</span>
                    </li>
                </ul>
            </div>
            
            <div class="col-9 col-md-10 bg-secondary">
                <nav class="navbar navbar-expand bg-light">
                    <div class="container-fluid">
                        <ul></ul>
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a href="#" class="nav-link">
                                    <i class="fa-solid fa-cog"></i>
                                </a>
                            </li>
                            <li class="nav-item dropdown">
                                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                                    <i class="fa-solid fa-user-circle"></i>
                                </a>
                                <div class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                                    <a href="#" class="dropdown-item">
                                        <i class="fa-solid fa-user me-2"></i>
                                        Profile
                                    </a>
                                    <a href="#" class="dropdown-item">
                                        <i class="fa-solid fa-sign-out me-2"></i>
                                        Logout
                                    </a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>

                <div class="p-3">
                      <div class="alert alert-info">
                        <i class="fa-solid fa-download me-3"></i>
                        A new version available
                    </div>

                    <div class="row flex-column flex-md-row">
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h3>1,250</h3>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-1"></i>
                                    Daily Users
                                </span>
                            </div>
                        </div>
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h3>8,250</h3>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-1"></i>
                                    Weekly Users
                                </span>
                            </div>
                        </div>
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h3>12,560</h3>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-1"></i>
                                    Monthly Users
                                </span>
                            </div>
                        </div>
                        <div class="col mb-3">
                            <div class="bg-light p-4">
                                <h3>102,250</h3>
                                <span class="text-success">
                                    <i class="fa-solid fa-chart-line me-1"></i>
                                    Daily Users
                                </span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
