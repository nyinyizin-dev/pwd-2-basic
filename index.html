<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="navbar bg-primary navbar-dark navbar-expand">
      <div class="container">
        <a href="#" class="navbar-brand">
          <i class="fa-regular fa-paper-plane fa-spin fa-xs" style="color: #FFD43B;"></i>
          App
        </a>

        <ul class="navbar-nav">
          <li class="nav-item">
            <a href="#" class="nav-link active">
              <i class="fa-solid fa-home me-1"></i>
              Home
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="fa-solid fa-user-circle me-1"></i>
              About
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="fa-solid fa-envelope me-1"></i>
              Contact
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="container">
      <ul class="nav nav-tabs my-4">
        <li class="nav-item">
          <a href="#" class="nav-link active">
            <i class="fa-solid fa-users me-1"></i>
            All Users
            <span class="badge bg-danger rounded-pill ms-2">10</span>
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link">New Users</a>
        </li>

        <li class="nav-item dropdown">
          <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
            >Other Users</a
          >
          <div class="dropdown-menu">
            <a href="#" class="dropdown-item">Daily Users</a>
            <a href="#" class="dropdown-item">Monthly Users</a>
            <a href="#" class="dropdown-item">Yearly Users</a>
          </div>
        </li>
      </ul>

      <div class="alert alert-info">
        primary, secondary, info, success, warning, danger, dark
      </div>

      <div class="card mb-4 bg-success text-light">
        <div class="card-header">Card Header</div>
        <div class="card-body">Card Body</div>
        <div class="card-footer">Card Footer</div>
      </div>

      <form class="mb-4">
        <div class="mb-2">
          <label for="name">Name</label>
          <input type="text" class="form-control" id="name" />
        </div>
        <div class="mb-2">
          <label for="address">Address</label>
          <textarea id="address" class="form-control"></textarea>
        </div>
        <div class="mb-2">
          <label for="gender">Gender</label>
          <select id="gender" class="form-select">
            <option value="1">Male</option>
            <option value="2">Female</option>
          </select>
        </div>
        <button class="btn btn-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i>
          Cancel
        </button>
        <button class="btn btn-primary">
         <i class="fa-regular fa-paper-plane fa-beat-fade" style="color: #74C0FC;"></i>
          Submit
        </button>
      </form>

      <table class="table table-bordered table-striped">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
        </tr>
        <tr>
          <td>1</td>
          <td>Alice</td>
          <td>22</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Bob</td>
          <td>22</td>
        </tr>
      </table>

      <div class="list-group">
        <div class="list-group-item">Item One</div>
        <div class="list-group-item">Item Tow</div>
        <div class="list-group-item">Item Three</div>
      </div>
    </div>
  </body>
</html>
