<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="bg-teal-200 p-3">
      <div class="container flex justify-between mx-auto">
        <h2>Hello</h2>
        <ul class="flex space-x-2">
          <li><a href="#">home</a></li>
          <li><a href="#">contact</a></li>
          <li><a href="#">about</a></li>
        </ul>
      </div>
    </nav>

    <div class="container my-4">
      <div class="alert alert-info">
        primary, secondary, info, success, warning, danger, dark
      </div>

      <div class="card mb-4 bg-yellow-400 text-teal-800">
        <div class="card-header">Card Header</div>
        <div class="card-body">Card Body</div>
        <div class="card-footer">Card Footer</div>
      </div>

      <table class="table table-bordered table-striped">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
        </tr>
        <tr>
          <td>1</td>
          <td>Alice</td>
          <td>22</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Bob</td>
          <td>22</td>
        </tr>
      </table>

      <div class="list-group">
        <div class="list-group-item">Item One</div>
        <div class="list-group-item">Item Tow</div>
        <div class="list-group-item">Item Three</div>
      </div>
    </div>
  </body>
</html>
